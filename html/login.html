<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="icon" type="image/x-icon" href="/image/logo/logo-bps.png" sizes="16x16">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Login — BPS Papua</title>
</head>
<body>

    <!-- Animated background blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <main>
        <div class="login-card">

            <!-- Logo + Brand -->
            <div class="brand">
                <img src="/image/logo/logo-bps.png" alt="BPS Logo" class="brand-logo">
                <div class="brand-text">
                    <span class="brand-name">BPS Papua</span>
                    <span class="brand-sub">Badan Pusat Statistik</span>
                </div>
            </div>

            <div class="divider"></div>

            <h2 class="login-title">Selamat Datang</h2>
            <p class="login-sub">Masuk ke portal publikasi data statistik</p>

            <!-- Error alert -->
            <div class="alert-error" id="alertError">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="alertMsg">Username atau password salah.</span>
            </div>

            <form id="loginForm" novalidate>
                <div class="field-group">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" id="username" name="username"
                               placeholder="Masukkan username" autocomplete="username" required>
                    </div>
                    <span class="field-error" id="errUsername"></span>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" id="password" name="password"
                               placeholder="Masukkan password" autocomplete="current-password" required>
                        <button type="button" class="toggle-pass" id="togglePass" tabindex="-1" aria-label="Tampilkan password">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                    <span class="field-error" id="errPassword"></span>
                </div>

                <div class="row-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember" id="remember">
                        <span class="checkmark"></span>
                        Ingat saya
                    </label>
                    <a href="#" class="forgot-link">Lupa password?</a>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span class="btn-text">Masuk</span>
                    <i class="bi bi-arrow-right btn-icon"></i>
                </button>
            </form>

        </div>
    </main>

    <footer class="login-footer">
        <address>Created by Athaya Daffa Winata (222413514@stis.ac.id)</address>
    </footer>
    
    <script src="/js/login.js"></script>
</body>
</html>
