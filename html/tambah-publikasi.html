<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/tambah-publikasi.css">
    <link rel="icon" type="image/x-icon" href="../image/logo/logo-bps.png" sizes="16x16">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>BPS PAPUA</title>
</head>
<body>
    <header>
        <div class="logo-text">
            <img src="../image/logo/logo-bps.png" alt="logo-bps" width="50px">
            <h1>Badan Pusat Statistik Papua</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html"><i class="bi bi-house"></i> Home</a></li>
                <li><a href="../html/daftar-publikasi.html"><i class="bi bi-card-list"></i> Daftar Publikasi</a></li>
                <li><a href="../html/tambah-publikasi.html" class="active"><i class="bi bi-plus-circle"></i> Tambah Publikasi</a></li>
                <li><a href="../html/galeri-publikasi.html"><i class="bi bi-people-fill"></i> Galeri Publikasi</a></li>
                <li><a href="../html/login.html"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Form Menambahkan Publikasi Baru</h2>

        <div class="form-wrapper">
            <!-- Pesan error -->
            <p id="pesanError"></p>

            <form action="#" onsubmit="return validate06C()">
                <div class="field-group">
                    <label for="Nomor">Nomor:</label>
                    <input type="text" id="Nomor" placeholder=" ">
                </div>

                <div class="field-group">
                    <label for="judul">Judul:</label>
                    <input type="text" id="judul" placeholder=" ">
                </div>

                <div class="field-group">
                    <label for="tanggal">Tanggal Rilis:</label>
                    <input type="date" id="tanggal">
                </div>

                <div class="field-group">
                    <label for="sampul">Sampul:</label>
                    <input type="file" id="sampul">
                </div>

                <button type="submit">Tambah</button>
            </form>
        </div>
    </main>

    <footer>
        <address>Created by Athaya Daffa Winata (222413514@stis.ac.id)</address>
    </footer>

    <script src="../js/tambah-publikasi.js"></script>
</body>
</html>
